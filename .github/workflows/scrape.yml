name: Actualizar agenda de concertos

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests beautifulsoup4

      - name: Scraper
        run: python scrape.py

      - name: Commit
        run: |
          git config user.name "Porto Ao Vivo Bot"
          git config user.email "bot@mizuca.github.io"
          git add events.json
          git diff --cached --quiet || git commit -m "agenda $(date -u +'%Y-%m-%d')"
          git push
